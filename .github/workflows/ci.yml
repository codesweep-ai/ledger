# Build, test and gate on every push.
#
# cs-ledger is a single static binary with no runtime dependencies, so the
# matrix is just the platforms it ships for, plus one job for the prose rules
# and one that checks this repository's own ledgers.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The viewer is a Vite/React app, and `make build` rebuilds it when its
      # sources have moved. Without a Node pinned here the build would run on
      # whatever the runner image happens to ship, and the version that matters
      # is not ours: @codesweep-ai/ui sets the floor at ^22.13.0 || >=24.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      # No linter install step: golangci-lint, deadcode and actionlint are pinned
      # as Go tools, so the gates build them from the module cache at the
      # versions this repository records. An unpinned linter would turn somebody
      # else's release into a red build on a pull request that touched nothing.

      # gofmt, vet, the Go linters, the Go suite, the viewer build and the prose
      # linters: the same target a contributor runs before pushing
      # (CONTRIBUTING.md).
      - name: make check
        run: make check

      # `make check` already merged the tiers, printed the aggregate to the job
      # summary and ran the gate — every test this repo has runs in this one
      # job, so there is nothing on another machine to merge with. The profile
      # is kept so a run's coverage can be opened line by line afterwards.
      - name: keep the coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: .coverage/coverage.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: build
        run: make build

      # Schema only: this validates the manifest, and does not prove a release
      # can be cut.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  # An invalid workflow file fails the run with zero jobs and no annotation in
  # the API, which is the least legible failure the forge produces. actionlint
  # is pinned as a Go tool in go.mod, so a clean `make actionlint` on a laptop
  # means a clean one here. Extra runner labels it does not know about live in
  # .github/actionlint.yaml.
  actionlint:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make actionlint

  # Its own job because it needs no matrix and builds nothing of this
  # repository, so it answers in a minute and answers even when the tests are
  # failing.
  # `make check` runs it too, for the contributor who runs one command before
  # pushing. cs-lint needs no install step: it is pinned in go.mod and the make
  # targets run it with `go tool`, so CI and a laptop use the same build.
  prose:
    name: docs prose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make prose

  # The rules this repository has to satisfy as a published project: the
  # licence, the document set, what must never reach a public commit, the
  # release path, and what a stranger's clone can do with it. fetch-depth: 0
  # because half of them read the history, and a shallow checkout would let
  # them pass by seeing nothing.
  # Everything the documents point at, resolved against the tree. It needs
  # no binary either, so it answers beside the prose job rather than after
  # the build.
  refs:
    name: docs refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make refs

  # The rules this repository has to satisfy as a published project: the
  # licence, the document set, what must never reach a public commit, the
  # release path, and what a stranger's clone can do with it. fetch-depth: 0
  # because half of them read the history, and a shallow checkout would let
  # them pass by seeing nothing.
  oss:
    name: open-source readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make oss

  # The documented interface against the real one: every command they name
  # exists, every command the binary carries is named, the settings the code
  # reads are the settings they list, and a sample output is still what the
  # command prints. It builds first, because every check here asks the binary.
  surface:
    name: docs surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Node for the viewer build; see build-test for why it is pinned.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: make surface

  # The freshness gate, on both corpora. A record changed without a re-render
  # must block the merge rather than surface later as a confusing diff.
  # fetch-depth: 0 because check resolves the shas the records cite against this
  # repository, and a shallow clone holds too little history to answer. It would
  # report the citations as unchecked and pass, which is the gate going quiet
  # rather than green.
  ledgers:
    name: ledger check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Node for the viewer build; see build-test for why it is pinned.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: make build
      - name: this repository's own ledger
        run: ./bin/cs-ledger check ledger
      - name: the sandbox corpus
        run: ./bin/cs-ledger check fixtures/sandbox/ledger
